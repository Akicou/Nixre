services:
  nixre-agent-sandbox:
    build: ./backend/agent-sandbox
    image: nixre-agent-sandbox:latest
    restart: "no"
    entrypoint: ["true"]

  nixre-db:
    image: postgres:16-alpine
    container_name: nixre-db
    restart: always
    environment:
      POSTGRES_USER: nixre
      POSTGRES_PASSWORD: nixre
      POSTGRES_DB: nixre
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nixre"]
      interval: 5s
      timeout: 3s
      retries: 20

  nixre-core:
    build: ./backend
    container_name: nixre-core
    restart: always
    environment:
      DATABASE_URL: postgres://nixre:nixre@nixre-db:5432/nixre
      REPOS_ROOT: /data/repos
      INTERNAL_TOKEN: ${NIXRE_INTERNAL_TOKEN:-dev-internal-token-change-me}
      AI_SECRET: ${NIXRE_AI_SECRET:-dev-ai-secret-change-me}
      SANDBOX_IMAGE: nixre-agent-sandbox:latest
      SANDBOX_IDLE_MS: ${SANDBOX_IDLE_MS:-900000}
      DOCKER_GID: ${DOCKER_GID:-}
      # Server-side signup kill switch: "true" makes POST /api/v1/register
      # return 403. Toggle via .env + `docker compose up -d nixre-core`.
      NIXRE_REGISTRATION_CLOSED: ${NIXRE_REGISTRATION_CLOSED:-false}
      # --- Deployments -------------------------------------------------
      # Central reverse proxy for deployed apps. Public traffic path:
      #   your edge (host Caddy / Cloudflare Tunnel) -> this port -> container.
      DEPLOY_PROXY_PORT: ${DEPLOY_PROXY_PORT:-3003}
      DEPLOY_BASE_DOMAIN: ${DEPLOY_BASE_DOMAIN:-}
      DEPLOY_HEALTH_TIMEOUT_MS: ${DEPLOY_HEALTH_TIMEOUT_MS:-30000}
      # Idle timeout for proxied app traffic (streaming AI services need more).
      DEPLOY_PROXY_TIMEOUT_MS: ${DEPLOY_PROXY_TIMEOUT_MS:-120000}
      # --- Runtime options policy (fail closed) -------------------------
      # Host bind mounts require BOTH an allowlist here AND instance admin.
      # Privileged mode and network_mode=host additionally need their flags.
      NIXRE_DEPLOY_BIND_ALLOWLIST: ${NIXRE_DEPLOY_BIND_ALLOWLIST:-}
      NIXRE_DEPLOY_ALLOW_PRIVILEGED: ${NIXRE_DEPLOY_ALLOW_PRIVILEGED:-false}
      NIXRE_DEPLOY_ALLOW_HOST_NETWORK: ${NIXRE_DEPLOY_ALLOW_HOST_NETWORK:-false}
      # --- Cloudflare DNS automation -----------------------------------
      # When set, tunnel-kind custom domains get their proxied CNAME
      # (<domain> -> <CLOUDFLARE_TUNNEL_ID>.cfargotunnel.com) created/removed
      # automatically via the Cloudflare API. Token needs Zone:Read + DNS:Edit
      # on the zones users attach domains from.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_TUNNEL_ID: ${CLOUDFLARE_TUNNEL_ID:-}
    group_add:
      - ${DOCKER_GID:-999}
    volumes:
      # :z so Fedora/SELinux allows the container to write the bind mount.
      - ./data/repos:/data/repos:z
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:3001:3002"
      # App deployments arrive here from your edge (host Caddy block or
      # Cloudflare Tunnel). 127.0.0.1 keeps it private by default; when the
      # edge runs on another host, publish it publicly instead.
      - "${DEPLOY_PROXY_BIND:-127.0.0.1}:${DEPLOY_PROXY_PORT:-3003}:${DEPLOY_PROXY_PORT:-3003}"
    depends_on:
      nixre-db:
        condition: service_healthy
      nixre-agent-sandbox:
        condition: service_completed_successfully

  nixre-ssh:
    build: ./ssh
    container_name: nixre-ssh
    restart: always
    environment:
      CORE_URL: http://nixre-core:3002
      INTERNAL_TOKEN: ${NIXRE_INTERNAL_TOKEN:-dev-internal-token-change-me}
      REPOS_ROOT: /data/repos
    volumes:
      - ./data/repos:/data/repos:z
      - ./data/ssh-keys:/etc/ssh/keys:z
    ports:
      - "3022:3022"
    depends_on:
      - nixre-core

  nixre-web:
    image: caddy:2-alpine
    container_name: nixre-web
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./ui/dist:/usr/share/caddy
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - nixre-core

  # Optional Cloudflare Tunnel for routed deployed apps (and/or the panel):
  #   docker compose --profile tunnels up -d nixre-tunnel
  # Set CLOUDFLARE_TUNNEL_TOKEN from the Zero Trust dashboard, then map public
  # hostnames to http://nixre-core:<DEPLOY_PROXY_PORT> (apps) or the panel.
  nixre-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: nixre-tunnel
    profiles: ["tunnels"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - nixre-core
