services:
  nixre-db:
    image: postgres:16-alpine
    container_name: nixre-db
    restart: always
    environment:
      POSTGRES_USER: nixre
      POSTGRES_PASSWORD: nixre
      POSTGRES_DB: nixre
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nixre"]
      interval: 5s
      timeout: 3s
      retries: 20

  nixre-core:
    build: ./backend
    container_name: nixre-core
    restart: always
    environment:
      DATABASE_URL: postgres://nixre:nixre@nixre-db:5432/nixre
      REPOS_ROOT: /data/repos
      INTERNAL_TOKEN: ${NIXRE_INTERNAL_TOKEN:-dev-internal-token-change-me}
      AI_SECRET: ${NIXRE_AI_SECRET:-dev-ai-secret-change-me}
    volumes:
      # :z so Fedora/SELinux allows the container to write the bind mount.
      - ./data/repos:/data/repos:z
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      nixre-db:
        condition: service_healthy

  nixre-ssh:
    build: ./ssh
    container_name: nixre-ssh
    restart: always
    environment:
      CORE_URL: http://nixre-core:3002
      INTERNAL_TOKEN: ${NIXRE_INTERNAL_TOKEN:-dev-internal-token-change-me}
      REPOS_ROOT: /data/repos
    volumes:
      - ./data/repos:/data/repos:z
      - ./data/ssh-keys:/etc/ssh/keys:z
    ports:
      - "3022:3022"
    depends_on:
      - nixre-core

  nixre-web:
    image: caddy:2-alpine
    container_name: nixre-web
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./ui/dist:/usr/share/caddy
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - nixre-core
